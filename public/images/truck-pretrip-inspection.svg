<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
<defs>
 <linearGradient id="cab" x2="0" y2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
 <style>
 .line{stroke:#18324b;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}
 .num{font:bold 25px Arial;fill:white;text-anchor:middle}
 .small{font: bold 18px Arial;fill:#18324b}
 </style>
</defs>
<rect width="1000" height="560" rx="28" fill="#f0f6fc"/>
<text x="500" y="48" text-anchor="middle" font-size="29" font-weight="bold" fill="#123456">PRE-TRIP TRUCK INSPECTION</text>
<path d="M70 390 H930" stroke="#9bb3c9" stroke-width="5"/>
<!-- trailer -->
<rect x="105" y="165" width="545" height="190" rx="12" fill="#dbeafe" stroke="#18324b" stroke-width="7"/>
