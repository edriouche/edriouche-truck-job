 <circle cx="220" cy="365" r="43"/><circle cx="550" cy="365" r="43"/>
 <circle cx="735" cy="365" r="43"/><circle cx="815" cy="365" r="43"/>
</g>
<g fill="#cbd5e1" stroke="#64748b" stroke-width="5">
 <circle cx="220" cy="365" r="18"/><circle cx="550" cy="365" r="18"/>
 <circle cx="735" cy="365" r="18"/><circle cx="815" cy="365" r="18"/>
</g>
<!-- mirror -->
<path d="M760 210 L780 175 L810 175" class="line"/>
<rect x="800" y="160" width="34" height="24" rx="5" fill="#93c5fd" stroke="#18324b" stroke-width="5"/>
