<path d="M650 300 L700 300" class="line"/>
<!-- cab -->
<path d="M700 210 L760 210 L835 270 L835 355 L680 355 L680 235 Q680 210 700 210Z" fill="url(#cab)" stroke="#18324b" stroke-width="7"/>
<path d="M760 225 L810 275 L760 275Z" fill="#dff4ff" stroke="#18324b" stroke-width="5"/>
<rect x="690" y="290" width="25" height="24" rx="4" fill="#fef08a" stroke="#18324b" stroke-width="4"/>
