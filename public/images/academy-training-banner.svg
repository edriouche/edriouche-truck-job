<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Professional truck driver academy</title><desc id="desc">A modern European truck in a professional training workshop with a trainer and trainee.</desc>
<defs>
