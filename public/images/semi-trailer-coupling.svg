<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Three stages of safe semi-trailer coupling</title>
<desc id="desc">Three clear side-view stages: secure both vehicles on level ground, align and reverse slowly, then confirm the fifth-wheel lock and connect air and electrical lines.</desc>
<rect width="1200" height="460" rx="24" fill="#f4f8fc"/>
<g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">
<rect x="20" y="20" width="365" height="420" rx="20" fill="#fff" stroke="#cbd8e5" stroke-width="3"/>
<rect x="417" y="20" width="365" height="420" rx="20" fill="#fff" stroke="#cbd8e5" stroke-width="3"/>
<rect x="814" y="20" width="365" height="420" rx="20" fill="#fff" stroke="#cbd8e5" stroke-width="3"/>
<circle cx="62" cy="62" r="28" fill="#0f3b5b"/><text x="62" y="72" font-size="30" fill="#fff">1</text>
<circle cx="459" cy="62" r="28" fill="#0f3b5b"/><text x="459" y="72" font-size="30" fill="#fff">2</text>
<circle cx="856" cy="62" r="28" fill="#0f3b5b"/><text x="856" y="72" font-size="30" fill="#fff">3</text>
</g>
<!-- stage 1: safe parking, separated vehicles -->
<g stroke="#183b5b" stroke-width="7" stroke-linejoin="round">
<path d="M48 340H355" stroke="#536579" stroke-width="8"/>
<path d="M58 230h104l28 42v62H58z" fill="#2d79ad"/><path d="M86 240h66l19 31H86z" fill="#c8e6f7"/>
<circle cx="100" cy="335" r="24" fill="#263544"/><circle cx="166" cy="335" r="24" fill="#263544"/>
<path d="M228 150h115v150H228z" fill="#dbe8f4"/><path d="M228 300v34M250 300v34" stroke="#475569" stroke-width="10"/>
<circle cx="270" cy="335" r="24" fill="#263544"/><circle cx="328" cy="335" r="24" fill="#263544"/>
</g>
<path d="M45 380H355" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/>
<path d="M195 385l-12 18h24z" fill="#16a34a"/>
<!-- stage 2: align and reverse -->
<g stroke="#183b5b" stroke-width="7" stroke-linejoin="round">
<path d="M445 230h104l28 42v62H445z" fill="#2d79ad"/><path d="M473 240h66l19 31h-85z" fill="#c8e6f7"/>
<circle cx="487" cy="335" r="24" fill="#263544"/><circle cx="553" cy="335" r="24" fill="#263544"/>
<path d="M612 150h145v150H612z" fill="#dbe8f4"/><circle cx="662" cy="335" r="24" fill="#263544"/><circle cx="720" cy="335" r="24" fill="#263544"/>
</g>
<path d="M570 210H600" stroke="#d97706" stroke-width="9" stroke-linecap="round"/>
<path d="M589 195l18 15-18 15" fill="none" stroke="#d97706" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M440 380H758" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/>
<!-- stage 3: coupled, supports up, connections -->
<g stroke="#183b5b" stroke-width="7" stroke-linejoin="round">
<path d="M840 230h100l28 42v62H840z" fill="#2d79ad"/><path d="M868 240h62l19 31h-81z" fill="#c8e6f7"/>
<circle cx="882" cy="335" r="24" fill="#263544"/><circle cx="948" cy="335" r="24" fill="#263544"/>
<path d="M978 150h170v150H978z" fill="#dbe8f4"/><circle cx="1030" cy="335" r="24" fill="#263544"/><circle cx="1100" cy="335" r="24" fill="#263544"/>
<path d="M956 286h32" stroke="#d97706" stroke-width="12"/><path d="M957 270q18 -22 38 0" fill="none" stroke="#d97706" stroke-width="7"/>
<path d="M960 285q20 18 38 0" fill="none" stroke="#2563eb" stroke-width="7"/>
<path d="M1000 300v-24M1018 300v-24" stroke="#475569" stroke-width="9"/>
</g>
<path d="M834 380H1156" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/>
<circle cx="1070" cy="95" r="25" fill="#16a34a"/><path d="M1058 95l9 9 17-20" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>